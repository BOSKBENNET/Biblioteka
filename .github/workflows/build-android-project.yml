name: "Build Biblioteka APK"

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.*', '**/*.gradle') }}

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleFlavorDefaultDebug
          mkdir -p dist
          cp app/build/outputs/apk/flavorDefault/debug/*.apk dist/Biblioteka.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Biblioteka-apk
          path: dist/Biblioteka.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Библиотека — последняя сборка
          body: "Сборка из коммита ${{ github.sha }}. Скачай Biblioteka.apk и установи."
          prerelease: false
          make_latest: true
          files: dist/Biblioteka.apk
